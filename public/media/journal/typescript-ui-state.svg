<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description"><title id="title">One screen. Five states.</title><desc id="description">Empty results and failed requests need different actions.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#192c3d}.label{font-size:21px;font-weight:700;letter-spacing:1px}.small{font-size:18px;fill:#52677a}</style><rect width="1200" height="675" rx="24" fill="#f6f4ee"/><circle cx="1100" cy="90" r="40" fill="#ff901c"/><text x="72" y="90" font-size="16" letter-spacing="3">KAMLING / DEV NOTES</text><text x="72" y="144" font-size="40" font-weight="700">One screen. Five states.</text><text x="72" y="182" font-size="22" fill="#52677a">Empty results and failed requests need different actions.</text><rect x="74" y="218" width="328" height="146" rx="20" fill="#edf1f5" stroke="#d3d9de"/><text x="98" y="266" class="label">IDLE</text><text x="98" y="318" font-size="21">Choose a day</text><rect x="434" y="218" width="328" height="146" rx="20" fill="#e9edff" stroke="#d3d9de"/><text x="458" y="266" class="label">LOADING</text><text x="458" y="318" font-size="21">Request in progress</text><rect x="74" y="406" width="328" height="146" rx="20" fill="#def1e6" stroke="#d3d9de"/><text x="98" y="454" class="label">READY</text><text x="98" y="506" font-size="21">Show available slots</text><rect x="434" y="406" width="328" height="146" rx="20" fill="#fff0d8" stroke="#d3d9de"/><text x="458" y="454" class="label">EMPTY</text><text x="458" y="506" font-size="21">Try another day</text><rect x="794" y="406" width="328" height="146" rx="20" fill="#fbe6e2" stroke="#d3d9de"/><text x="818" y="454" class="label">ERROR</text><text x="818" y="506" font-size="21">Retry the request</text>
<path d="M402 288h32M598 364v22M238 386h720M238 386v20M598 386v20M958 386v20" fill="none" stroke="#63758a" stroke-width="3"/><text x="815" y="265" font-size="24">status narrows the type</text><text x="815" y="302" class="small">No slots ≠ request failed</text><text x="72" y="619" font-size="16" letter-spacing="2">EXPLANATORY DIAGRAM · NOT A PRODUCT SCREENSHOT</text></svg>
